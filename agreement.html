<!DOCTYPE html>
<!-- Página do contrato: agreement.html?id=cs_... (contrato assinado) ou ?region=uk|us (modelo em branco) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Service agreement | Molina Growth</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--paper:#E3E3DF;--ink:#000;--mute:#585854;--rule:#BDBDB8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}
  .bar{max-width:860px;margin:0 auto;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .bar img{height:44px}
  .bar button{all:unset;cursor:pointer;background:#000;color:#E3E3DF;font-weight:700;padding:12px 18px;border-radius:4px}
  .bar button:focus-visible{outline:3px solid #2340FF}
  .paper{max-width:860px;margin:18px auto 40px;background:#fff;padding:44px 52px;border-radius:6px}
  .status{max-width:860px;margin:14px auto 0;padding:0 20px;color:var(--mute)}
  .ag h2{font-size:22px;letter-spacing:.04em;margin:0;text-align:center}
  .ag-title{text-align:center;font-weight:700;margin:4px 0 0}
  .ag-law{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 26px}
  .ag h3{font-size:14px;margin:22px 0 6px}
  .ag p{margin:0 0 10px;text-align:justify}
  .ag-table{width:100%;border-collapse:collapse;margin:12px 0 16px;font-size:14px}
  .ag-table th,.ag-table td{border:1px solid #ddd;padding:7px 10px;text-align:left;vertical-align:top}
  .ag-table th{width:38%;background:#f5f5f3;font-weight:600}
  .ag-sign th{background:#eef4ef}
  .ag-blank{color:#999}
  @media (max-width:640px){ .paper{padding:24px 18px;margin:12px 8px 30px} .ag p{text-align:left} }
  @media print{
    body{background:#fff}
    .bar button,.status{display:none}
    .bar{padding:0 0 10px}
    .paper{margin:0;padding:0;max-width:none;border-radius:0}
    .ag h3{break-after:avoid}
    .ag-table{break-inside:auto}
  }
</style>
</head>
<body>
  <div class="bar">
    <img src="logo-header.png" alt="Molina Growth">
    <button type="button" id="print">Download PDF / Print</button>
  </div>
  <p class="status" id="status">Loading agreement…</p>
  <main class="paper" id="doc" hidden></main>
<script type="module" src="agreement.js?v=1"></script>
</body>
</html>
