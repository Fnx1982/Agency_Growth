# Configuração do Cloudflare Worker (site + backend de pagamento)
name = "agency-growth"
main = "worker.js"
compatibility_date = "2026-10-01"

# Arquivos do site (HTML, CSS, JS, imagens), todos na raiz do repositório.
# O arquivo .assetsignore esconde do público os arquivos do backend.
# Só o que não for arquivo (ex.: /api/...) chega no Worker.
[assets]
directory = "./"
binding = "ASSETS"

[observability]
enabled = true

# Variáveis NÃO secretas. As secretas (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY)
# vão no painel da Cloudflare: Worker > Settings > Variables and Secrets > tipo Secret.
[vars]
# Remetente dos e-mails (domínio verificado no Resend):
MAIL_FROM = "Molina Growth <hello@molinagrowthagency.com>"
# Quem recebe os avisos da equipe (pode ser mais de um, separado por vírgula):
TEAM_EMAIL = "molinagrowthagency@gmail.com"
# E-mail que aparece no site e para onde vão as respostas dos clientes
# (o Email Routing da Cloudflare encaminha para o Gmail):
CONTACT_EMAIL = "hello@molinagrowthagency.com"

# Tarefa diária (12:00 UTC): cancela planos mensais com parcela em aberto há 90 dias.
[triggers]
crons = ["0 12 * * *"]